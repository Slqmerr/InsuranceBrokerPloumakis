title: Επαγγελματική Αστική Ευθύνη
intro: Κάλυψη για ζημιές σε τρίτους κατά τη λειτουργία της επιχείρησής σας — από τη γενική ευθύνη του χώρου μέχρι την ευθύνη του προϊόντος και του επαγγέλματος.
description: "Η «αστική ευθύνη» δεν είναι ένα προϊόν, αλλά μια οικογένεια καλύψεων. Κοινός τους παρονομαστής είναι ότι αποζημιώνουν τρίτους — πελάτες, επισκέπτες, εργαζόμενους, προμηθευτές — για σωματικές βλάβες ή υλικές ζημιές που προκλήθηκαν από υπαιτιότητα της επιχείρησης, μαζί με τα δικαστικά έξοδα υπεράσπισης. Αυτό που αλλάζει από κάλυψη σε κάλυψη είναι η πηγή της ευθύνης: ο χώρος και η λειτουργία, το προϊόν ή η υπηρεσία που παρέχετε, ή οι αποφάσεις των προσώπων που διοικούν. Τα όρια κάλυψης κινούνται συνήθως από 100.000€ έως 1.000.000€ και άνω, ανάλογα με τη δραστηριότητα και τις απαιτήσεις πελατών ή διαγωνισμών."
covers:
  - Σωματικές βλάβες και υλικές ζημιές σε τρίτους από τη λειτουργία της επιχείρησης
  - Δικαστικά έξοδα και αμοιβές υπεράσπισης, ακόμη και για αξιώσεις που τελικά απορρίπτονται
  - Ευθύνη από τη χρήση του χώρου, των εγκαταστάσεων και του εξοπλισμού
  - Ευθύνη από πυρκαγιά, έκρηξη και διαρροή προς τρίτους και προς τον ιδιοκτήτη του ακινήτου
  - Ευθύνη από εργασίες σε χώρο τρίτου, με επέκταση για ζημιές σε αντικείμενα υπό τη φύλαξή σας
  - Επεκτάσεις για εργοδοτική ευθύνη, ευθύνη προϊόντος και υπεργολάβους
  - Κλιμακούμενα όρια ανά περιστατικό, ανά θύμα και ανά έτος, από 100.000€ έως 1.000.000€ και άνω
  - Δυνατότητα ένταξης σε ενιαίο πακέτο μαζί με την ασφάλιση περιουσίας της επιχείρησης
needs:
  - Δραστηριότητα και αντικείμενο της επιχείρησης
  - Αριθμός εργαζομένων και ετήσιος κύκλος εργασιών
  - Τετραγωνικά και χρήση των χώρων που επισκέπτονται τρίτοι
  - Επιθυμητά όρια κάλυψης ή όρια που απαιτεί πελάτης / διαγωνισμός
