title: Ξενοδοχεία - Ενοικιαζόμενα Δωμάτια - AIRBNB
intro: Μία κάλυψη για το κτίριο, τον εξοπλισμό και τους επισκέπτες σας — και για την υποχρεωτική πλέον αστική ευθύνη της βραχυχρόνιας μίσθωσης.
description: "Ξενοδοχεία, ενοικιαζόμενα δωμάτια, ξενώνες και καταλύματα βραχυχρόνιας μίσθωσης (Airbnb, Booking) είναι σύνθετοι κίνδυνοι: κτίριο και εξοπλισμός, επισκέπτες που κυκλοφορούν σε δωμάτια, πισίνα, ανελκυστήρα και κουζίνα, προσωπικό, και έσοδα που σταματούν με την πρώτη σοβαρή ζημιά. Το πρόγραμμα καλύπτει και την περιουσία και την ευθύνη σας απέναντι στον πελάτη, με τις καλύψεις να προσαρμόζονται στο μέγεθος και στις παροχές της μονάδας. Σημειώστε ότι το AirCover της Airbnb και η αντίστοιχη κάλυψη της Booking δεν υποκαθιστούν το ασφαλιστήριο αστικής ευθύνης που ζητά ο νόμος, ούτε καλύπτουν κρατήσεις που έρχονται από άλλα κανάλια."
covers:
  - "Υποχρεωτική ασφάλιση αστικής ευθύνης: από 1/10/2025 ο ν. 5170/2025 απαιτεί ασφαλιστήριο αστικής ευθύνης για κάθε ακίνητο βραχυχρόνιας μίσθωσης, με πρόστιμο 5.000€ στη μη συμμόρφωση"
  - Αστική ευθύνη προς επισκέπτες και τρίτους για σωματικές βλάβες και υλικές ζημιές από ατύχημα στους χώρους του καταλύματος
  - Αστική ευθύνη από τη λειτουργία πισίνας, τζακούζι, ανελκυστήρα και χώρων στάθμευσης
  - Εργοδοτική αστική ευθύνη για ατυχήματα του προσωπικού
  - Τροφική δηλητηρίαση από το πρωινό ή το εστιατόριο της μονάδας
  - Πυρκαγιά, κεραυνός, έκρηξη, καπνός — και μετάδοση πυρκαγιάς από δάσος
  - Σεισμός, καθίζηση και κατολίσθηση εδάφους
  - "Καιρικά φαινόμενα: πλημμύρα, θύελλα, χαλάζι, βάρος χιονιού, παγετός"
  - Ζημιές από νερά λόγω θραύσης ή διαρροής σωληνώσεων ύδρευσης, θέρμανσης και αποχέτευσης
  - Κλοπή με διάρρηξη ή ληστεία, ζημιές του κτιρίου από την απόπειρά της, ληστεία ταμείου
  - Κακόβουλες ενέργειες, τρομοκρατικές ενέργειες, στάσεις και απεργίες
  - Βραχυκύκλωμα, θραύση κρυστάλλων και καθρεπτών, φωτεινές επιγραφές
  - Έπιπλα, εξοπλισμός δωματίων, λευκά είδη και ηλεκτρικές συσκευές
  - Απώλεια ή ζημιά προσωπικών αντικειμένων των πελατών, εκτός τιμαλφών
  - "Διακοπή εργασιών: απώλεια εσόδων ή ημερήσιο επίδομα όσο η μονάδα μένει εκτός λειτουργίας μετά από ζημιά"
  - Κάλυψη της δόσης δανείου κατά την περίοδο αποκατάστασης
  - Έξοδα κατεδάφισης, απομάκρυνσης ερειπίων και αμοιβές μηχανικών
  - Νομική προστασία της μονάδας και του ιδιοκτήτη
  - Επείγουσα τεχνική βοήθεια 24 ώρες το 24ωρο
needs:
  - Είδος καταλύματος — ξενοδοχείο, ενοικιαζόμενα δωμάτια ή κατοικία βραχυχρόνιας μίσθωσης
  - Αριθμός δωματίων ή κλινών και τετραγωνικά
  - Διεύθυνση του ακινήτου και έτος κατασκευής
  - Αν λειτουργεί πισίνα, ανελκυστήρας, κουζίνα ή εστιατόριο
  - Αριθμός εργαζομένων και μήνες λειτουργίας τον χρόνο
  - ΑΜΑ Μητρώου Βραχυχρόνιας Διαμονής ή αριθμός γνωστοποίησης λειτουργίας (ΜΗ.Τ.Ε.)
