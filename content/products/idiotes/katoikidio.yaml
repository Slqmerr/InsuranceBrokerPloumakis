title: Κατοικίδια
intro: Κτηνιατρική φροντίδα για τον σκύλο ή τη γάτα σας, από το τσεκάπ μέχρι το χειρουργείο.
description: Η ασφάλιση κατοικιδίου καλύπτει έξοδα νοσηλείας, εξετάσεων και θεραπειών για σκύλους και γάτες, από ατύχημα ή ασθένεια. Προγράμματα όπως το ERGO My Pet προσφέρουν κάλυψη ανεξαρτήτως ράτσας και, συνήθως, την αστική ευθύνη του ιδιοκτήτη αν το ζώο προκαλέσει ζημιά σε τρίτους.
covers:
  - Κτηνιατρικές επισκέψεις από ατύχημα ή ασθένεια
  - Διαγνωστικές εξετάσεις και θεραπείες
  - Νοσηλεία και χειρουργικές επεμβάσεις
  - Επείγοντα περιστατικά, με 24ωρο συντονιστικό κέντρο
  - Άμεση εξυπηρέτηση σε συμβεβλημένο δίκτυο κτηνιάτρων και κλινικών
  - Εκπτώσεις και παροχές σε υπηρεσίες φροντίδας, καλλωπισμού και διατροφής
  - Προγράμματα για σκύλους και γάτες κάθε ηλικίας και ράτσας
needs:
  - Είδος και ράτσα του κατοικιδίου
  - Ηλικία του ζώου
  - Αριθμός microchip και βιβλιάριο εμβολιασμών
