title: Κατοικία
intro: >-
  Προστασία για το σπίτι και το περιεχόμενό του — από τη φωτιά και τον σεισμό
  μέχρι τη διαρροή και την κλοπή.
description: >-
  Η ασφάλιση κατοικίας καλύπτει το κτίριο και το περιεχόμενο από πυρκαγιά,
  σεισμό, πλημμύρα, κλοπή και άλλα απρόβλεπτα, μειώνοντας το κόστος
  αποκατάστασης μιας ζημιάς. Το πρόγραμμα διαμορφώνεται ανάλογα με τα
  χαρακτηριστικά της κατοικίας και τις καλύψεις που επιλέγετε, ενώ υπό
  προϋποθέσεις μπορεί να συνεπάγεται και μείωση του ΕΝΦΙΑ.
covers:
  - Πυρκαγιά, κεραυνός, έκρηξη, καπνός
  - Σεισμός, καθίζηση και κατολίσθηση εδάφους
  - 'Καιρικά φαινόμενα: πλημμύρα, θύελλα, χαλάζι, βάρος χιονιού'
  - Ζημιές από νερά λόγω θραύσης ή διαρροής σωληνώσεων
  - >-
    Κλοπή μετά από διάρρηξη και ζημιές του κτιρίου από την απόπειρά της·
    κακόβουλες ενέργειες και ταραχές
  - Πτώση δέντρων, στύλων ή κεραιών, πρόσκρουση οχήματος, πτώση αεροσκάφους
  - Θραύση κρυστάλλων και ζημιές από βραχυκύκλωμα
  - >-
    Αστική ευθύνη προς τρίτους, με δυνατότητα επέκτασης σε οικογενειακή αστική
    ευθύνη
  - Έξοδα κατεδάφισης, απομάκρυνσης συντριμμιών και αμοιβές μηχανικών
  - >-
    Κάλυψη της δόσης στεγαστικού δανείου αν η κατοικία μείνει προσωρινά μη
    κατοικήσιμη
  - Επείγουσα τεχνική βοήθεια στο σπίτι, 24 ώρες το 24ωρο
  - Ασφάλιση περιεχομένου και για ενοικιαστές, με αποζημίωση σε αξία καινούριου
  - >-
    Δυνατότητα κάλυψης φωτοβολταϊκής εγκατάστασης και επιλογών «κατά παντός
    κινδύνου»
  - Μείωση ΕΝΦΙΑ έως 20% για την ασφαλισμένη κατοικία
needs:
  - Τετραγωνικά και έτος κατασκευής
  - Διεύθυνση του ακινήτου
  - Εκτίμηση αξίας περιεχομένου
  - Αν υπάρχει στεγαστικό δάνειο
