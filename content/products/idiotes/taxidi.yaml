title: Ταξιδιωτικές Ασφαλίσεις
intro: Ηρεμία σε κάθε ταξίδι — από ένα ιατρικό απρόοπτο στο εξωτερικό μέχρι μια χαμένη βαλίτσα.
description: "Η ταξιδιωτική ασφάλιση αναλαμβάνει τα απρόοπτα που μπορεί να προκύψουν πριν ή κατά τη διάρκεια ενός ταξιδιού: από ένα επείγον ιατρικό περιστατικό στο εξωτερικό, μέχρι καθυστέρηση πτήσης ή απώλεια αποσκευών. Τα προγράμματα προσαρμόζονται στον προορισμό, τη διάρκεια και τον σκοπό του ταξιδιού σας, είτε πρόκειται για διακοπές, επαγγελματική μετακίνηση ή ταξίδι που απαιτεί θεώρηση Schengen."
covers:
  - Επείγοντα ιατρικά έξοδα στο εξωτερικό, με 24ωρη τηλεφωνική υποστήριξη
  - Πλήρη διαχείριση και μεταφορά σε έκτακτο ιατρικό περιστατικό
  - Ακύρωση ή διακοπή ταξιδιού
  - Απώλεια ή καθυστέρηση αποσκευών
  - Κάλυψη που πληροί τις προϋποθέσεις για θεώρηση Schengen
  - Ασφάλιση ανά ταξίδι ή ετήσια πολυταξιδιωτικά προγράμματα
  - Ατομικά, οικογενειακά και επαγγελματικά ταξίδια
  - Ειδικά προγράμματα για φοιτητές εξωτερικού (π.χ. Erasmus)
needs:
  - Προορισμός και διάρκεια ταξιδιού
  - Αριθμός και ηλικίες ταξιδιωτών
  - Σκοπός ταξιδιού (διακοπές, επαγγελματικό, σπουδές)
