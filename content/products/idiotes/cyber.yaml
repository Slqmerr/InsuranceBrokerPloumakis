title: Ασφάλιση Cyber
intro: >-
  Προστασία για εσάς και την οικογένειά σας από τις οικονομικές και ψηφιακές
  συνέπειες της ζωής στο διαδίκτυο.
description: >-
  Καθώς η καθημερινότητα γίνεται ολοένα πιο ψηφιακή, η ασφάλιση cyber προσφέρει
  υποστήριξη σε περιστατικά όπως παραβίαση προσωπικών δεδομένων, ηλεκτρονική
  απάτη και κακόβουλες επιθέσεις. Περιλαμβάνει υπηρεσίες άμεσης αντίδρασης από
  εξειδικευμένους τεχνικούς και νομικούς συμβούλους.
covers:
  - Κλοπή ψηφιακής ταυτότητας
  - Ηλεκτρονική απάτη και οικονομικές απώλειες από online συναλλαγές
  - Προστασία διαδικτυακών αγορών
  - Έξοδα αποκατάστασης συστημάτων και ανάκτησης δεδομένων μετά από επίθεση
  - Εκβιασμός μέσω διαδικτύου (cyber extortion)
  - Απώλεια εισοδήματος εξαιτίας ηλεκτρονικού συμβάντος
  - >-
    Περιστατικά διαδικτυακού εκφοβισμού (cyberbullying), με κάλυψη για όλη την
    οικογένεια
  - 24ωρη τεχνική υποστήριξη και καθοδήγηση από εξειδικευμένους συνεργάτες
needs:
  - Χρήση ηλεκτρονικών συναλλαγών και μέσων
  - Πόσα μέλη της οικογένειας θα καλυφθούν
  - Τυχόν προηγούμενα περιστατικά
iconName: ShieldCheck
color: "#a30000"
