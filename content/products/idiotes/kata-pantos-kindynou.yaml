title: Κατά Παντός Κινδύνου
intro: >-
  Μία «ομπρέλα» προστασίας που καλύπτει κάθε αιφνίδιο και απρόβλεπτο γεγονός,
  πέρα από τους κατονομασμένους κινδύνους.
description: >-
  Η κάλυψη «κατά παντός κινδύνου» λειτουργεί σαν ομπρέλα πάνω από το
  ασφαλιστήριο περιουσίας σας: αποζημιώνει υλικές ζημιές στο κτίριο και στο
  περιεχόμενο από κάθε αιφνίδιο, τυχαίο και απρόβλεπτο γεγονός που δεν
  κατονομάζεται ήδη στις επιμέρους καλύψεις. Έτσι, αντί να ασφαλίζεστε μόνο για
  συγκεκριμένους κινδύνους, προστατεύεστε για ό,τι δεν προβλέπεται — με σαφείς
  εξαιρέσεις που ορίζονται στο συμβόλαιο. Συνήθως προσφέρεται σε κύριες
  κατοικίες ή περιουσίες υψηλότερης ασφαλισμένης αξίας.
covers:
  - Κάθε αιφνίδιο, τυχαίο και απρόβλεπτο γεγονός
  - Ζημιές πέρα από τους κατονομασμένους κινδύνους του συμβολαίου
  - Κτίριο και περιεχόμενο σε ενιαία κάλυψη
  - 'Ενδεικτικά: θραύση σωληνώσεων, βραχυκύκλωμα, τυχαία ζημιά'
  - Συνδυασμός με πυρκαγιά, σεισμό, πλημμύρα και κλοπή
  - Υψηλά όρια κάλυψης για περιουσίες μεγαλύτερης αξίας
needs:
  - Είδος και αξία της περιουσίας (κτίριο και περιεχόμενο)
  - 'Χρήση: κύρια ή εξοχική κατοικία'
  - Υφιστάμενες καλύψεις που θέλετε να διευρύνετε
